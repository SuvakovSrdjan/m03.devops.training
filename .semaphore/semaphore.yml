version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: "\U0001F9EA Test"
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Run Tests"
          commands:
            - checkout
            - cd 1-signing
            - gpg --import ~/public.key
            - gpg --import ~/private.key
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
            - gpg --verify artifact.txt.sig artifact.txt
      secrets:
        - name: gpg_key_srdjan
  - name: SBOM
    dependencies:
      - "\U0001F9EA Test"
    task:
      secrets:
        - name: gpg_key_srdjan
      jobs:
        - name: Cyclonedex
          commands:
            - checkout
            - cd 2-sbom
            - pip install cyclonedx-bom
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - cyclonedx-py requirements -o bom.json
  - name: Audit dependencies
    dependencies:
      - SBOM
    task:
      jobs:
        - name: pip audit
          commands:
            - checkout
            - cd 3-dependency-scanning
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - sudo apt-get update -y && sudo apt-get install -y python3.12-venv
            - python3 -m venv venv
            - source venv/bin/activate
            - pip install pip-audit
            - pip-audit -r requirements.txt
  - name: SAST Scan
    dependencies:
      - Audit dependencies
    task:
      jobs:
        - name: Bandit
          commands:
            - checkout
            - cd 4-sast
            - pip install bandit
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - bandit -r vulnerable_script.py
  - name: DAST-scan
    dependencies:
      - SAST Scan
    task:
      jobs:
        - name: wapiti
          commands:
            - checkout
            - cd 5-dast
            - sudo apt-get update -y && sudo apt-get install -y python3.12-venv && sudo  apt install -y gunicorn
            - python3 -m venv venv
            - source venv/bin/activate
            - pip install wapiti3
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - 'gunicorn -b 0:0:0:0:4000 app:app --daemon'
            - 'wapiti -u http://localhost:4000 -f html'
            - artifact push job /home/semaphore/.wapiti/generated_report/*.html
