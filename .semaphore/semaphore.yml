version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: "\U0001F9EA Test"
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Run Tests"
          commands:
            - checkout
            - cd 1-signing
            - gpg --import ~/public.key
            - gpg --import ~/private.key
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
            - gpg --verify artifact.txt.sig artifact.txt
      secrets:
        - name: gpg_key_srdjan
  - name: SBOM
    dependencies:
      - "\U0001F9EA Test"
    task:
      secrets:
        - name: gpg_key_srdjan
      jobs:
        - name: Sbom
          commands:
            - pip install cyclonedx-bom
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - cyclonedx-py requirements -o bom.json
